name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FLASK_APP: wsgi.py
      SECRET_KEY: ci-only-secret
      JWT_SECRET_KEY: ci-only-jwt-secret-at-least-32-bytes-long
      DATABASE_URL: postgresql+psycopg://forge:forge@localhost:5432/forge_test
      TEST_DATABASE_URL: postgresql+psycopg://forge:forge@localhost:5432/forge_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (real PostgreSQL, migrations round-tripped)
        run: pytest --cov=app --cov-report=term-missing
      - name: Models and migrations are in sync
        run: flask db upgrade && flask db check
