upstream forge_api {
    server api:8000;
    keepalive 16;
}

# Basic per-IP rate limit at the edge; finer-grained limits live in the API.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://forge_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    root /usr/share/nginx/html;

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The single-page app: client-side routes all load index.html, which is never cached so a
    # deploy takes effect on the next navigation.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
