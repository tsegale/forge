# Local development override: publishes PostgreSQL and Redis to the host, creates the forge_test
# database used by pytest, and adds Mailpit, which catches outgoing email (web UI on :8025).
# Never use this file in production.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db redis mailpit
#
# Set FORGE_DB_PORT / FORGE_REDIS_PORT if 5432 / 6379 are already taken on your machine.

x-dev-db-credentials: &dev-db-credentials
  POSTGRES_USER: ${POSTGRES_USER:-forge}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
  POSTGRES_DB: ${POSTGRES_DB:-forge}

services:
  db:
    environment: *dev-db-credentials
    ports:
      - "127.0.0.1:${FORGE_DB_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    # Docker does not publish ports for containers attached only to internal networks.
    networks: [backend, dev]

  redis:
    ports:
      - "127.0.0.1:${FORGE_REDIS_PORT:-6379}:6379"
    networks: [backend, dev]

  # Catches every email the app sends; view them at http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORGE_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${FORGE_MAILPIT_UI_PORT:-8025}:8025"
    networks: [backend, dev]

  # When the full stack runs with this override, send its email to Mailpit.
  api:
    environment: &dev-mail
      MAIL_SERVER: mailpit
      MAIL_PORT: "1025"
      MAIL_USE_TLS: "false"
  worker:
    environment: *dev-mail
  beat:
    environment: *dev-mail

networks:
  dev:
