name: forge

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
  MAIL_SERVER: ${MAIL_SERVER}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-Forge <orders@forge.local>}
  # Where links in emails point (password reset). Defaults to the local Nginx port.
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
  STORE_CURRENCY: ${STORE_CURRENCY:-nad}
  FORGE_ENV: ${FORGE_ENV:-production}
  TRUSTED_PROXY_COUNT: 1   # nginx; makes per-IP rate limits see the real client address

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # One-shot job: schema migrations run once per deploy, never inside API replicas.
  migrate:
    build: ./backend
    command: ["flask", "db", "upgrade"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  api:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      # WebP photos written by `flask seed images`, served by nginx. The sources stay on the host.
      - media:/app/media
      - ./backend/seed/images:/app/seed/images:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend, edge]

  # Background jobs: the reservation sweeper, emails, partition maintenance.
  worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    # The image's HEALTHCHECK probes the API over HTTP; a worker proves itself by answering a ping.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 30s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]

  # Exactly one scheduler, or periodic jobs would run more than once.
  beat:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *backend-env
    # Beat rewrites its schedule file every few minutes while it is alive.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/celerybeat-schedule') > 600)\""]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]

  # Edge server: serves the built React app and proxies /api, so both share one origin.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - media:/usr/share/nginx/media:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

volumes:
  pgdata:
  redisdata:
  media:

networks:
  backend:
    internal: true   # db and redis are unreachable from outside the stack
  edge:
