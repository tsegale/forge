upstream forge_api {
    server api:8000;
    keepalive 16;
}

# One id per request, end to end: the client's X-Request-ID if it sent one (the app validates it
# and replaces anything malformed), else nginx's own. Logged here and by the app.
map $http_x_request_id $forge_request_id {
    ""      $request_id;
    default $http_x_request_id;
}
log_format forge '$remote_addr - [$time_iso8601] "$request_method $uri $server_protocol" $status '
                 '$body_bytes_sent ${request_time}s upstream=${upstream_response_time}s id=$forge_request_id';

# Basic per-IP rate limit at the edge; finer-grained limits live in the API.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 5m;

    access_log /var/log/nginx/access.log forge;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/content-security-policy.conf;
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://forge_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $forge_request_id;
        proxy_read_timeout 30s;
    }

    # API documentation: proxied like the API, but the app sends these pages their own policy
    # (they load Swagger UI and Redoc from a CDN), so nginx must not add the strict one: a
    # browser enforces every policy it receives.
    location /api/docs {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://forge_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $forge_request_id;
        proxy_read_timeout 30s;
    }

    root /usr/share/nginx/html;

    # Hashed build assets never change: cache them for a year.
    # Product photos (WebP, written by `flask seed images` into the shared media volume). Each
    # name carries a hash of its source, so a changed photo is a new URL: cache for a year.
    location /media/ {
        include /etc/nginx/snippets/security-headers.conf;
        alias /usr/share/nginx/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/content-security-policy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The single-page app: client-side routes all load index.html, which is never cached so a
    # deploy takes effect on the next navigation.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/content-security-policy.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
