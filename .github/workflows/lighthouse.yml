name: Lighthouse

# The production build behind Nginx, as deployed (docker compose), audited by Lighthouse.
# Accessibility and best practices must score 95 or more on every page (lighthouserc.json).
# Pushes to main and the redesign branch, and by hand (workflow_dispatch only works once the file
# is on the default branch). Not on other branch pushes: it builds every image.
on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge-ci-only
      POSTGRES_DB: forge
      SECRET_KEY: ci-only-secret
      JWT_SECRET_KEY: ci-only-jwt-secret-at-least-32-bytes-long
      # Development settings on the production images: no Stripe keys, so the payment simulator,
      # and no real mail server (nothing in this audit sends mail).
      FORGE_ENV: development
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: whsec_ci_only_fake_gateway # required by both gateways
      STRIPE_PUBLISHABLE_KEY: ""
      MAIL_SERVER: 127.0.0.1
      HTTP_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Demo data
        run: docker compose run --rm api flask seed demo --yes
      - name: Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail=200
