# Local development override: publishes PostgreSQL and Redis to the host and creates the
# forge_test database used by pytest. Never use this file in production.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db redis
#
# Set FORGE_DB_PORT / FORGE_REDIS_PORT if 5432 / 6379 are already taken on your machine.

x-dev-db-credentials: &dev-db-credentials
  POSTGRES_USER: ${POSTGRES_USER:-forge}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
  POSTGRES_DB: ${POSTGRES_DB:-forge}

services:
  db:
    environment: *dev-db-credentials
    ports:
      - "127.0.0.1:${FORGE_DB_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    # Docker does not publish ports for containers attached only to internal networks.
    networks: [backend, dev]

  redis:
    ports:
      - "127.0.0.1:${FORGE_REDIS_PORT:-6379}:6379"
    networks: [backend, dev]

networks:
  dev:
